# package.json'daki sürüm numarası değişip main dalına gönderildiğinde Windows kurulum
# dosyasını üretir ve GitHub Releases'e yayınlar (vX.Y.Z etiketini de kendisi oluşturur).
# Kurulu uygulamalar bu sürümü otomatik olarak indirir.
# Aynı sürüm zaten eksiksiz yayınlandıysa yeniden derlemez.
# Sürüm notları CHANGELOG.md'den alınır; notu olmayan sürüm yayınlanmaz.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Yarıda kalmış sürümler (kurulum dosyası veya latest.yml eksik) güncellemeyi bozar: etiketiyle birlikte sil.
      - name: Remove incomplete releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q '.[] | select(([.assets[].name | test("\\.exe$")] | any | not) or ([.assets[].name | test("^latest\\.yml$")] | any | not)) | .tag_name' |
          while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting incomplete release $tag"
            gh release delete "$tag" --cleanup-tag -y --repo "$GITHUB_REPOSITORY"
          done

      # Yayınlanmış sürümlerin notlarını CHANGELOG.md ile eşitle (notlar sonradan düzeltilebilsin).
      - name: Sync release notes from changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q '.[].tag_name' | while read -r tag; do
            [ -z "$tag" ] && continue
            if node scripts/release-notes.js "$tag" > "notes-$tag.md" 2>/dev/null; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "notes-$tag.md" && echo "Updated notes for $tag"
            else
              echo "No changelog entry for $tag, leaving notes as they are"
            fi
          done

      - name: Skip if already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${{ steps.ver.outputs.tag }} already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm install --no-audit --no-fund

      # Bu sürümün CHANGELOG.md notu yoksa yayınlanmaz.
      - name: Release notes
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          node scripts/release-notes.js "${{ steps.ver.outputs.tag }}" > release-notes.md || {
            echo "::error::CHANGELOG.md has no entry for ${{ steps.ver.outputs.tag }}"; exit 1; }
          cat release-notes.md

      # Testler geçmezse sürüm yayınlanmaz.
      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        run: npm test

      # electron-builder sadece dosyaları üretir; yüklemeyi gh yapar.
      - name: Build installer
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee build.log || {
            # Hata satırlarını uyarı notu olarak yaz (log indirilemediğinde okunabilsin).
            grep -nE "⨯|[Ee]rror|failed|cannot" build.log | head -n 10 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
          ls -la dist

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Phasmo Helper $TAG" \
            --notes-file release-notes.md

      - name: Verify release assets
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$assets"
          echo "$assets" | grep -q '\.exe$' || { echo "::error::Installer missing from release"; exit 1; }
          echo "$assets" | grep -q '^latest\.yml$' || { echo "::error::latest.yml missing from release"; exit 1; }
